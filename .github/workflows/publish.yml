name: Push

on: push

jobs:
  test:
    name: Lint, build, and test
    # Not ubuntu-latest: libdeflate's C compiles with the image's clang, and
    # the bundle npm ships is the one built here, so an image change alters the
    # published wasm with no source change and check:wasm cannot see it. Bump
    # deliberately, as with crate/rust-toolchain.toml.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # installs the channel and wasm target crate/rust-toolchain.toml pins
      - run: rustup toolchain install
        working-directory: crate
      # crate/build-wasm.sh installs the wasm-bindgen-cli that Cargo.lock pins
      # through binstall, as a prebuilt binary, when binstall is on PATH.
      # Without it the script falls back to `cargo install`, which compiles the
      # CLI from source on every run.
      - uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # before the build, which rewrites the bundle: fails when crate/ changed
      # without a regenerated, committed bundle
      - run: pnpm check:wasm
      - run: pnpm lint
      # eslint doesn't enforce formatting, so without this the tree drifts out
      # of prettier's shape silently and the next person to touch a file gets
      # unrelated reformatting mixed into their diff.
      - run: pnpm format:check
      # `pnpm build` only compiles src/. This is the same check over test/ too,
      # which is otherwise never type-checked: a test can call a renamed option
      # or a changed signature and go on passing by testing nothing.
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test --run
      - run: pnpm test:pack

  publish:
    name: Publish to npm
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04 # same image as the test job, for the same reason
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # installs the channel and wasm target crate/rust-toolchain.toml pins
      - run: rustup toolchain install
        working-directory: crate
      # crate/build-wasm.sh installs the wasm-bindgen-cli that Cargo.lock pins
      # through binstall, as a prebuilt binary, when binstall is on PATH.
      # Without it the script falls back to `cargo install`, which compiles the
      # CLI from source on every run.
      - uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          # the job that publishes installs from the registry, not from a cache
          # another run wrote; setup-node caches unless told not to
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm publish --access public

  release:
    name: Create GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # to create the release. Kept in its own job so the npm publish job's
      # token stays read-only.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Notes come from the CHANGELOG.md section git-cliff wrote during
      # `pnpm version`, which is part of the tagged commit — so this needs
      # neither full history nor a second pass over the git log.
      - name: Create release
        run: |
          ./scripts/release-notes.sh "$GITHUB_REF_NAME" > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file /tmp/notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
